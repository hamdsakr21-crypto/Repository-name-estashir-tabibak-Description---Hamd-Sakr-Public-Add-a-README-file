<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استشير طبيبك - مجاني</title>
<style>
body{font-family:Tahoma; background:#f5f9ff; margin:0; padding:15px}
.header{background:#0052cc; color:white; padding:20px; border-radius:20px; text-align:center}
.card{background:white; border-radius:15px; padding:15px; margin:15px 0; box-shadow:0 2px 10px #0001}
.btn-free{background:#00b894; color:white; border:0; padding:14px; border-radius:10px; width:100%; font-size:16px; margin:5px 0}
.btn-paid{background:#d63031; color:white; border:0; padding:14px; border-radius:10px; width:100%; font-size:16px; margin:5px 0}
.badge{background:#ffeaa7; padding:5px 10px; border-radius:20px; font-size:12px}
.small{color:#777; font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="header">
<h2>🏥 استشير طبيبك</h2>
<p>كل الفحوصات مجانية 100% - ادفع فقط لو كلمت دكتور لايف</p>
<span class="badge">✅ يقبل الدفع بـ Pi Network</span>
</div>
<div class="card">
<h3>🔍 فحوصات مجانية - جرب الآن</h3>
<button class="btn-free" onclick="location.href='checkup.html'">❤️ فحص 60 ثانية</button>
<button class="btn-free" onclick="alert('قريباً: اختبار نظر')">👁️ اختبار النظر - مجاني</button>
<button class="btn-free" onclick="alert('قريباً: اختبار سمع')">👂 اختبار السمع - مجاني</button>
</div>
<div class="card" style="border:2px solid #d63031">
<h3>💬 استشارة طبيب لايف - مدفوعة</h3>
<button class="btn-paid" onclick="if(confirm('سعر الاستشارة 50 جنيه أو 1.5 Pi')) location.href='doctors.html'">كلم دكتور الآن - مدفوع</button>
</div>
<div class="small">© 2026 استشير طبيبك</div>
</body>
</html>
